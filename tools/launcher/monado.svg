<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bladeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="#18181c"/>
  <!-- Outer red ring of Monado -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="url(#ringGrad)" stroke-width="20"/>
  <!-- Inner cyan light ring -->
  <circle cx="128" cy="128" r="56" fill="none" stroke="url(#bladeGrad)" stroke-width="10"/>
  <!-- Center symbol/core -->
  <circle cx="128" cy="128" r="28" fill="url(#bladeGrad)"/>
  <circle cx="128" cy="128" r="16" fill="#18181c"/>
</svg>
